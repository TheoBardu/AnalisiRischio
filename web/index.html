<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analisi Valutazione Rischio</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="tema.css">
<script>
  /* tema ricordato dall'ultima volta: si applica prima del primo disegno,
     cosi' aprendo in tema chiaro non si vede il lampo di quello scuro */
  try {
    document.documentElement.dataset.theme = localStorage.getItem('tema') || 'scuro';
  } catch (err) { /* niente memoria: si parte dal tema scuro */ }
</script>
</head>
<body>

<div class="win">
  <div class="tbar" id="tbar">
    <span style="color:color-mix(in srgb,var(--color-text) 70%,transparent)">Analisi Valutazione Rischio</span>
    <span style="margin-left:auto;font-size:11px;color:var(--color-accent)" id="stato-titolo"></span>
  </div>

  <div class="shell">
    <div class="side" id="side"></div>
    <div class="main" id="main"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
